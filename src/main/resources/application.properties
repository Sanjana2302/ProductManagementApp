spring.application.name=demo
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/productapp_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
jwt.access.secret=3f8a2b1c9d4e7f0a6b5c8d2e1f4a7b0c3d6e9f2a5b8c1d4e7f0a3b6c9d2e5f8a
jwt.refresh.secret=9a2b5c8d1e4f7a0b3c6d9e2f5a8b1c4d7e0f3a6b9c2d5e8f1a4b7c0d3e6f9a2b
jwt.access.expiration=900000
jwt.refresh.expiration=604800000

# CORS
cors.allowed.origin=http://localhost:5173

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Request size limit
spring.servlet.multipart.max-file-size=10KB
spring.servlet.multipart.max-request-size=10KB
server.tomcat.max-http-form-post-size=10240

# Logging
logging.level.org.springframework=INFO
logging.level.com.example.demo=DEBUG
